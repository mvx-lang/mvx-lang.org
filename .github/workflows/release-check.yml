name: Rebuild on a new release

# The PAGE reads GitHub itself, so a new release shows without any of this.
# What is baked into the page is the fallback -- what a reader with no
# JavaScript sees, and what shows when GitHub cannot be reached -- so it is
# still worth keeping close to the truth.  Daily is enough for a fallback;
# it was hourly when the page depended on it.
#
# A token-triggered workflow_dispatch may start another workflow, so no
# personal token is needed.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - id: cmp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: https://mvx-lang.org/releases.json
        run: node scripts/release-changed.mjs >> "$GITHUB_OUTPUT"

      - if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
